# Render Blueprint -- deploys the Node/Express backend and the Python
# ml-service together as two free web services. See DEPLOYMENT.md for the
# full click-by-click walkthrough (MongoDB Atlas, this blueprint, then the
# Vercel frontend deploy).
#
# To use: push this repo to GitHub, then in Render choose
# "New +" -> "Blueprint" and point it at the repo. Render reads this file
# and creates both services below in one go. Values marked `sync: false`
# are left blank here on purpose -- Render will prompt you for them once,
# during that Blueprint creation step.

services:
  - type: web
    name: iblms-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGO_URI
        sync: false # paste your MongoDB Atlas connection string here
      - key: JWT_SECRET
        generateValue: true # Render generates a random secret for you
      - key: FRONTEND_ORIGIN
        sync: false # set this to your Vercel URL once you have it (step 5)
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ML_SERVICE_URL
        sync: false # set this to the iblms-ml-service URL below once it's deployed
      - key: ML_SERVICE_TIMEOUT_MS
        # Was 1500 (1.5s) -- too short to ever catch the ml-service waking
        # up from Render's free-tier 15-min sleep (~30-60s cold start), so
        # every ML feature (compatibility score, demand forecast, empty-run
        # risk) silently fell back to "unavailable" on a cold visit. 8s is
        # still fast when the service is already warm, and gives a cold
        # request a real chance without hanging the whole page for a minute.
        value: 8000

  - type: web
    name: iblms-ml-service
    runtime: python
    plan: free
    rootDir: ml-service
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: PYTHON_VERSION
        # pandas==2.2.2/numpy==1.26.4 in requirements.txt have no prebuilt
        # wheel for Render's current default Python, which made the very
        # first Blueprint deploy fail on "metadata-generation-failed"
        # building pandas from source. Pinning to 3.10 (what this was
        # trained/tested with) fixes it. If you ever recreate this
        # Blueprint from scratch, this saves you from hitting that same
        # build failure and having to set it manually in the dashboard.
        value: 3.10.12
